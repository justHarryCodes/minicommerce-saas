name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # `npm run build:ci` is `next build` with no migration step (unlike
      # `npm run build`, which runs scripts/run-migrations.mjs first — that
      # applies real database migrations and must never run against a
      # shared database from an arbitrary PR branch). It still needs
      # placeholder env vars: src/lib/db.ts and src/lib/firebase-admin.ts
      # both throw at module load if their env vars are unset, and Next
      # imports every route module during the build's "collect page data"
      # step even though nothing here uses generateStaticParams or
      # build-time DB fetches. These values are never used to actually
      # connect to anything — the build only needs them to be *present*.
      # FIREBASE_ADMIN_PRIVATE_KEY below is a throwaway RSA keypair generated
      # solely for this workflow — not derived from any real Firebase
      # project or credential. firebase-admin's cert() parses it as ASN.1 at
      # module load, so it must be syntactically valid PEM, but it is never
      # used to sign or authenticate anything real.
      - run: npm run build:ci
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          FIREBASE_ADMIN_PROJECT_ID: ci-placeholder
          FIREBASE_ADMIN_CLIENT_EMAIL: ci-placeholder@ci-placeholder.iam.gserviceaccount.com
          FIREBASE_ADMIN_PRIVATE_KEY: |
