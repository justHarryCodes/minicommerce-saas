name: Scheduled jobs

# Pings the app's cron endpoints. Needs two repository secrets:
#   APP_URL      e.g. https://dukanigeria.com
#   CRON_SECRET  same value as the app's CRON_SECRET env var
# Without them the job exits successfully and does nothing.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send abandoned-cart + appointment reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets not set — skipping."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/jobs"
